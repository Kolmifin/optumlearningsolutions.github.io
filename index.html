<!DOCTYPE html>
<html>
<head>
  <title>Training Leaders Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f6f9;
    }

    header {
      background: #1e293b;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .container {
      padding: 20px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
      gap: 15px;
    }

    .module-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    button {
      background: #2563eb;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .learning-card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      margin-top: 20px;
      box-shadow: 0px 6px 12px rgba(0,0,0,0.15);
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>

<body>

<header>
  <h1>Training Leaders Hub</h1>
  <p>Interactive Learning Journey</p>
</header>

<div class="container">

<h2>Select a Module</h2>

<div class="card-grid">

  <div class="module-card">
    <h3>Leadership Skills</h3>
    <button onclick="startJourney('leadership')">Start Journey</button>
  </div>

  <div class="module-card">
    <h3>Root Cause Analysis</h3>
    <button onclick="startJourney('rca')">Start Journey</button>
  </div>

</div>

<div id="learningArea"></div>

</div>

<script>

let step = 0;
let moduleType = "";

function startJourney(type){
  moduleType = type;
  step = 0;
  nextStep();
}

function nextStep(){

  let content = "";

  // ===== LEADERSHIP JOURNEY =====
  if(moduleType === "leadership"){

    let steps = [

      `<h3>Welcome to Leadership Skills</h3>
      <p>You are now acting as a Training Leader. Your decisions impact learner success.</p>`,

      `<h3>Why Leadership Matters</h3>
      <p>Training Leaders drive engagement, performance, and confidence of learners.</p>`,

      `<h3>Scenario</h3>
      <p>Your class is disengaged. Learners are not participating.</p>
      <p>What will you do?</p>`,

      `<h3>Best Practice</h3>
      <p>A strong Training Leader adapts immediately:
      Ask questions, add interaction, and energize the group.</p>`,

      `<h3>Apply It</h3>
      <p>Think of your last training session.<br>
      What would you change to improve engagement?</p>`
    ];

    content = steps[step];
  }

  // ===== ROOT CAUSE JOURNEY =====
  if(moduleType === "rca"){

    let steps = [

      `<h3>Welcome to Root Cause Analysis</h3>
      <p>As a Training Leader, you must solve problems effectively.</p>`,

      `<h3>Problem Scenario</h3>
      <p>Trainees are failing assessments in Week 2.</p>`,

      `<h3>Use 5W Method</h3>
      <p>
      What → Low scores<br>
      Where → Training room<br>
      When → Week 2<br>
      Who → New hires<br>
      Why → Lack of understanding
      </p>`,

      `<h3>Insight</h3>
      <p>The issue is not performance — it's knowledge gap.</p>`,

      `<h3>Action</h3>
      <p>Solution: Add practice sessions and reinforcement.</p>`
    ];

    content = steps[step];
  }

  document.getElementById("learningArea").innerHTML = `
    <div class="learning-card">
      ${content}
      <br><br>
      <button onclick="prevStep()">Back</button>
      <button onclick="goNext()">Next</button>
    </div>
  `;
}

function goNext(){
  step++;
  nextStep();
}

function prevStep(){
  if(step > 0){
    step--;
    nextStep();
  }
}

</script>

</body>
</html>
